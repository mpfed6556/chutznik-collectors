name: Chutznik Rental Sync

# Runs automatically, on GitHub's own servers — your computer is never
# involved. Change the schedule below to run more or less often.
# Cron format: minute hour day month weekday (all in UTC).
# "0 * * * *" = once every hour, on the hour.
on:
  schedule:
    - cron: '0 * * * *'   # every hour — change to '*/30 * * * *' for every 30 min, etc.
  workflow_dispatch: {}     # lets you also click "Run workflow" manually on GitHub any time

permissions:
  contents: write   # needed so the workflow can save its "already seen" memory back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install cheerio

      - name: Run the rental sync
        working-directory: scripts
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: node rental-sync.js

      - name: Save "already seen" memory back to the repo
        run: |
          git config user.name "chutznik-rental-sync"
          git config user.email "actions@github.com"
          git add seen-rentals.json blocked-sites.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "Rental sync: update seen/blocked memory [skip ci]"
          git push || true
